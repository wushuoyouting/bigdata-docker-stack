#同步MySQL编码字典表（全量表）到Doris ods层
env {
  parallelism = 8
  job.mode = "BATCH"
  checkpoint.interval = 30000

  # 本地文件系统检查点
  # execution.checkpoint.data-uri = "file:///opt/seatunnel/checkpoints"  # 已注释：3.1.1不支持
  # execution.buffer-timeout = 5000  # 已注释：3.1.1不支持

  # JVM 参数优化
  # execution.jvm-options = "-Xms4g -Xmx8g -XX:+UseG1GC -XX:MaxGCPauseMillis=100"  # 已注释：3.1.1不支持
}

source {
  Jdbc {
    result_table_name = "mysql_seatunnel"
    # url = "jdbc:mysql://192.168.241.128:3306/gmall?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&rewriteBatchedStatements=true&useServerPrepStmts=true&cachePrepStmts=true"  # 已注释：旧地址
    # url = "jdbc:mysql://127.0.0.1:3306/gmall?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&rewriteBatchedStatements=true&useServerPrepStmts=true&cachePrepStmts=true"  # 已注释：容器内127不可用
    url = "jdbc:mysql://host.docker.internal:3306/gmall?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&rewriteBatchedStatements=true&useServerPrepStmts=true&cachePrepStmts=true"
    driver = "com.mysql.cj.jdbc.Driver"
    connection_check_timeout_sec = 30
    # user = "gmall"  # 已注释：旧账号配置
    user = "root"
    # password = "gmall"  # 已注释：旧账号配置
    password = "123456"

    # 使用分区并行读取
    query = "select dic_code, dic_name, parent_code, create_time, operate_time from gmall.base_dic"
    partition_column = "dic_code"
    partition_num = 8

    # 连接池配置
    # connection_pool {  # 已注释：3.1.1不支持
      # max_size = 20  # 已注释：3.1.1不支持-块内
      # min_idle = 5  # 已注释：3.1.1不支持-块内
      # max_idle_ms = 60000  # 已注释：3.1.1不支持-块内
    # }  # 已注释：3.1.1不支持-块结束

    # 批处理配置
    fetch_size = 10000
    # batch_size = 5000  # 已注释：3.1.1不支持
    # is_exactly_once = true  # 已注释：3.1.1不支持
  }
}

transform {
  Sql {
    source_table_name = "mysql_seatunnel"
    result_table_name = "doris_sink_data"

    query = """
      select
        dic_code,
        formatdatetime(create_time,'yyyy-MM-dd') as k1,
        dic_name, 
        parent_code, 
        create_time, 
        operate_time
      from mysql_seatunnel
    """
  }
}

sink {
  Doris {
    source_table_name = "doris_sink_data"
    # fenodes = "192.168.241.128:8030"  # 已注释：旧地址
    # fenodes = "127.0.0.1:8030"  # 已注释：容器内127不可用
    fenodes = "doris-fe:8030"
    # username = "root"  # 已注释：旧账号配置
    username = "admin"
    # password = ""  # 已注释：旧账号配置
    password = "41d2ebfc1e994efb9f3b189b"
    table.identifier = "ods.ods_base_dic_full"
    sink.enable-2pc = "true"
    sink.label-prefix = "test_json"

    # 优化Doris写入配置
    # sink.properties {  # 已注释：3.1.1不支持
    # sink.properties {  # 已注释：3.1.1不支持-块内
      # format = "json"  # 已注释：3.1.1不支持-块内
      # read_json_by_line = "true"  # 已注释：3.1.1不支持-块内
      # column_separator = "\t"  # 已注释：3.1.1不支持-块内
      # line_delimiter = "\n"  # 已注释：3.1.1不支持-块内
      # max_filter_ratio = "0.1"  # 已注释：3.1.1不支持-块内
    # }  # 已注释：3.1.1不支持-块结束

    # 批量写入配置
    sink.buffer-size = 10000
    sink.buffer-count = 3
    # sink.flush.interval-ms = 5000  # 已注释：3.1.1不支持
    sink.max-retries = 3
    # sink.parallelism = 8  # 已注释：3.1.1不支持

    doris.config = {
      column_separator = "\t"
      line_delimiter = "\n"
      max_filter_ratio = "0.1"
      format = "json"
      read_json_by_line = "true"
      request_connect_timeout_ms = "5000"
      request_timeout_ms = "30000"
      request_tablet_size = "5"
    }
  }
}
