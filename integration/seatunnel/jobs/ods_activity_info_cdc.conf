env {
  # 环境配置
  parallelism = 8                     # 增加并行度以提高吞吐量
  job.mode = "STREAMING"              # 使用流式处理模式进行实时同步
  checkpoint.interval = 10000         # 检查点间隔，单位毫秒

  # 限流配置 - 避免对源数据库造成过大压力
  read_limit.bytes_per_second = 10000000  # 每秒读取字节数限制，约10MB/s
  read_limit.rows_per_second = 1000       # 每秒读取行数限制

  # 本地检查点配置
  # execution.checkpoint.data-uri = "file:///opt/seatunnel/checkpoints"  # 已注释：3.1.1不支持
  # execution.checkpoint.max-concurrent = 1  # 已注释：3.1.1不支持

  # 性能优化参数
  # execution.buffer-timeout = 5000  # 已注释：3.1.1不支持
  # execution.jvm-options = "-Xms4g -Xmx8g -XX:+UseG1GC -XX:MaxGCPauseMillis=100"  # 已注释：3.1.1不支持
}

source {
  MySQL-CDC {
    # 基本连接配置
    # server-id = 5652-5657             # MySQL复制客户端的唯一ID范围
    # username = "root"                # 数据库用户名  # 已注释：旧账号配置
    username = "root"                # 数据库用户名
    # password = ""                # 数据库密码  # 已注释：旧账号配置
    password = "123456"                # 数据库密码
    table-names = ["gmall.activity_info"]  # 要同步的表
    # base-url = "jdbc:mysql://192.168.241.128:3306/gmall?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai"  # 已注释：旧地址
    # base-url = "jdbc:mysql://127.0.0.1:3306/gmall?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai"  # 已注释：容器内127不可用
    base-url = "jdbc:mysql://host.docker.internal:3306/gmall?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai"

    # CDC 特有配置
    schema-changes.enabled = true     # 启用架构变更捕获
    server-time-zone = "Asia/Shanghai"  # 服务器时区

    # 性能优化配置
    # snapshot.mode = "initial"  # 已注释：3.1.1不支持
    startup.mode = "initial"      # 启动模式：initial(全量+增量)
    snapshot.fetch.size = 10000   # 快照获取大小
    # chunk.size.rows = 8096  # 已注释：3.1.1不支持
    snapshot.split.size = 8096   # 分块大小，用于并行快照
    connection.pool.size = 10    # 连接池大小

    # 高级配置
    # include.schema.changes = true  # 已注释：3.1.1不支持
    # scan.startup.mode = "initial"  # 已注释：3.1.1不支持，由startup.mode覆盖
    # scan.incremental.snapshot.chunk.size = 8096  # 已注释：3.1.1不支持
    # debezium.min.row.count.to.stream.results = 1000  # 已注释：3.1.1不支持

    # 容错配置
    # connect.timeout = 30000  # 已注释：3.1.1不支持
    connect.timeout.ms = 30000   # 连接超时时间(毫秒)
    connect.max-retries = 3      # 最大重试次数

    # 输出表名
    result_table_name = "mysql_cdc_source"
  }
}

# 可选的转换逻辑，如果需要对数据进行处理
transform {
  Sql {
    source_table_name = "mysql_cdc_source"
    result_table_name = "doris_sink_data"

    # 根据需要转换字段，这里添加了一个分区字段k1
    query = """
      select
        id,
        formatdatetime(create_time,'yyyy-MM-dd') as k1,
        activity_name,
        activity_type,
        activity_desc,
        start_time,
        end_time,
        create_time
      from mysql_cdc_source
    """
  }
}

sink {
  Doris {
    # 基本连接配置
    source_table_name = "doris_sink_data"  # 或直接使用 "mysql_cdc_source"
    # fenodes = "192.168.241.128:8030"  # 已注释：旧地址
    # fenodes = "127.0.0.1:8030"  # 已注释：容器内127不可用
    fenodes = "doris-fe:8030"
    # username = "root"  # 已注释：旧账号配置
    username = "admin"
    # password = ""  # 已注释：旧账号配置
    password = "41d2ebfc1e994efb9f3b189b"
    table.identifier = "ods.ods_activity_info_full"  # Doris目标表

    # 事务和标签配置
    sink.enable-2pc = "true"          # 启用两阶段提交，确保一致性
    sink.label-prefix = "cdc_sync"    # 导入标签前缀

    # CDC删除同步：Doris Unique模型开启batch delete
    sink.enable-delete = "true"

    # 写入模式配置
    # sink.properties {  # 已注释：3.1.1不支持，参数并入doris.config
    #   format = "json"
    #   read_json_by_line = "true"
    #   column_separator = "\t"
    #   line_delimiter = "\n"
    #   max_filter_ratio = "0.1"
    #   merge_type = "MERGE"
    #   delete_enable = "true"
    # }

    # 性能优化配置
    sink.buffer-size = 10000          # 缓冲区大小
    sink.buffer-count = 3             # 缓冲区数量
    # sink.flush.interval-ms = 5000  # 已注释：3.1.1不支持
    sink.max-retries = 3              # 最大重试次数
    # sink.parallelism = 8  # 已注释：3.1.1不支持

    # Doris连接优化
    doris.config = {
      format = "json"
      read_json_by_line = "true"
      column_separator = "\t"
      line_delimiter = "\n"
      max_filter_ratio = "0.1"
      # merge_type = "MERGE"  # 已注释：需DELETE ON子句，由sink.enable-delete处理
      request_connect_timeout_ms = "5000"  # 连接超时
      request_timeout_ms = "30000"         # 请求超时
      request_tablet_size = "5"            # 每个请求的tablet数量
    }
  }
}