env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 10000
}

source {
  Kafka {
    result_table_name = "kafka_log"

    topic = "ods_log_full"
    bootstrap.servers = "kafka:29092"
    consumer.group = "ods_log_full"
    start_mode = earliest
    format = json

    # JSON 消息结构：嵌套 ROW 对应 common/start/page/err
    schema = {
      fields {
        common = {
          ar = "string"
          ba = "string"
          ch = "string"
          is_new = "string"
          md = "string"
          mid = "string"
          os = "string"
          uid = "string"
          vc = "string"
        }
        start = {
          entry = "string"
          loading_time = "string"
          open_ad_id = "string"
          open_ad_ms = "string"
          open_ad_skip_ms = "string"
        }
        page = {
          during_time = "bigint"
          item = "string"
          item_type = "string"
          last_page_id = "string"
          page_id = "string"
          source_type = "string"
        }
        actions = "string"
        displays = "string"
        err = {
          error_code = "bigint"
          msg = "string"
        }
        ts = "bigint"
      }
    }

    kafka.config = {
      auto.offset.reset = "earliest"
      enable.auto.commit = "false"
    }
  }
}

transform {
  Sql {
    source_table_name = "kafka_log"
    result_table_name = "iceberg_sink_data"

    # 展开嵌套字段，生成主键 id 与分区键 k1
    # SeaTunnel Kafka source 无 Flink 的 METADATA 字段，id 用设备ID+时间戳+用户ID组合
    query = """
      select
        concat_ws('_',
          common.mid,
          cast(ts as string),
          common.uid
        ) as id,
        from_unixtime(cast(ts / 1000 as bigint), 'yyyy-MM-dd', 'Asia/Shanghai') as k1,
        common.ar  as common_ar,
        common.ba  as common_ba,
        common.ch  as common_ch,
        common.is_new as common_is_new,
        common.md  as common_md,
        common.mid as common_mid,
        common.os  as common_os,
        common.uid as common_uid,
        common.vc  as common_vc,
        start.entry as start_entry,
        start.loading_time as start_loading_time,
        start.open_ad_id as start_open_ad_id,
        start.open_ad_ms as start_open_ad_ms,
        start.open_ad_skip_ms as start_open_ad_skip_ms,
        page.during_time as page_during_time,
        page.item as page_item,
        page.item_type as page_item_type,
        page.last_page_id as page_last_page_id,
        page.page_id as page_page_id,
        page.source_type as page_source_type,
        actions,
        displays,
        err.error_code as err_error_code,
        err.msg as err_msg,
        ts
      from kafka_log
    """
  }
}

sink {
  Iceberg {
    source_table_name = "iceberg_sink_data"

    # Iceberg Catalog：JDBC 元数据 + MinIO S3 存储
    catalog_name = "iceberg_catalog"
    iceberg.catalog.config = {
      type = "jdbc"
      uri = "jdbc:postgresql://host.docker.internal:5432/iceberg_meta"
      jdbc.user = "root"
      jdbc.password = "123456"
      warehouse = "s3://lakehouse/iceberg_lake_doris/"
      io-impl = "org.apache.iceberg.aws.s3.S3FileIO"
      s3.endpoint = "http://minio:9000"
      s3.access-key-id = "ak6c52d75066d96ddd"
      s3.secret-access-key = "5cf0fa1d0e1fd9bf182be642beca1a15"
      s3.region = "us-east-1"
      s3.path-style-access = "true"
    }

    namespace = "iceberg_doris_ods"
    table = "ods_log_inc"

    iceberg.table.write-props = {
      write.format.default = "parquet"
      write.target-file-size-bytes = 536870912
    }

    iceberg.table.primary-keys = "id"
    iceberg.table.partition-keys = "k1"
    iceberg.table.upsert-mode-enabled = true
    iceberg.table.schema-evolution-enabled = true
    iceberg.table.auto-create-props = {
      "format-version" = "2"
    }
    case_sensitive = true
  }
}
