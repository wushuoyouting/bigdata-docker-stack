# 同步MySQL活动SKU表（全量模式）到Doris ods层
env {
  # 并行度设置
  parallelism = 1
  
  # 作业模式：BATCH表示批处理模式，适合全量同步
  job.mode = "BATCH"
}

source {
  # 使用JDBC连接器从MySQL读取数据
  Jdbc {
    # url = "jdbc:mysql://192.168.241.128:3306/gmall?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai"  # 已注释：旧地址
    # url = "jdbc:mysql://127.0.0.1:3306/gmall?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai"  # 已注释：容器内127不可用
    url = "jdbc:mysql://host.docker.internal:3306/gmall?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai"
    driver = "com.mysql.cj.jdbc.Driver"
    # user = "root"  # 已注释：旧账号配置
    user = "root"
    # password = ""  # 已注释：旧账号配置
    password = "123456"
    query = "select * from activity_sku"
    
    # 结果表名，用于后续处理
    result_table_name = "mysql_source"
  }
}

# 数据转换处理
transform {
  # 使用SQL进行数据转换
  Sql {
    source_table_name = "mysql_source"
    result_table_name = "doris_sink_data"
    
    # 添加分区字段k1，用于Doris表分区
    query = """
      select 
        id,
        formatdatetime(create_time,'yyyy-MM-dd') as k1,
        activity_id,
        sku_id,
        create_time
      from mysql_source
    """
  }
}

sink {
  Doris {
    source_table_name = "doris_sink_data"
    # fenodes = "192.168.241.128:8030"  # 已注释：旧地址
    # fenodes = "127.0.0.1:8030"  # 已注释：容器内127不可用
    fenodes = "doris-fe:8030"
    # username = "root"  # 已注释：旧账号配置
    username = "admin"
    # password = ""  # 已注释：旧账号配置
    password = "41d2ebfc1e994efb9f3b189b"
    table.identifier = "ods.ods_activity_sku_full"
    sink.enable-2pc = "true"
    sink.label-prefix = "test_json"

    # 优化Doris写入配置
    # sink.properties {  # 已注释：3.1.1不支持
    # sink.properties {  # 已注释：3.1.1不支持-块内
      # format = "json"  # 已注释：3.1.1不支持-块内
      # read_json_by_line = "true"  # 已注释：3.1.1不支持-块内
      # column_separator = "\t"  # 已注释：3.1.1不支持-块内
      # line_delimiter = "\n"  # 已注释：3.1.1不支持-块内
      # max_filter_ratio = "1.0"  # 已注释：3.1.1不支持-块内
    # }  # 已注释：3.1.1不支持-块结束

    # 批量写入配置
    sink.buffer-size = 5000
    sink.buffer-count = 3
    # sink.flush.interval-ms = 5000  # 已注释：3.1.1不支持
    sink.max-retries = 5
    # sink.parallelism = 4  # 已注释：3.1.1不支持

    doris.config = {
      column_separator = "\t"
      line_delimiter = "\n"
      max_filter_ratio = "1.0"
      format = "json"
      read_json_by_line = "true"
      request_connect_timeout_ms = "10000"
      request_timeout_ms = "60000"
      request_tablet_size = "2"
    }
  }
}
