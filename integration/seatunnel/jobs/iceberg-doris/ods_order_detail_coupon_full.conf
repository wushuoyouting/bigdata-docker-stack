#同步MySQL订单明细优惠券关联表（全量表）到Doris ods层
env {
  parallelism = 4  # 设置适当的并行度
  job.mode = "BATCH"
  checkpoint.interval = 30000

  # 本地文件系统检查点
  # execution.checkpoint.data-uri = "file:///opt/seatunnel/checkpoints"  # 已注释：3.1.1不支持
  # execution.buffer-timeout = 5000  # 已注释：3.1.1不支持

  # JVM 参数优化
  # execution.jvm-options = "-Xms4g -Xmx8g -XX:+UseG1GC -XX:MaxGCPauseMillis=100"  # 已注释：3.1.1不支持
}

source {
  Jdbc {
    result_table_name = "mysql_seatunnel"
    # url = "jdbc:mysql://192.168.241.128:3306/gmall?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&rewriteBatchedStatements=true&useServerPrepStmts=true&cachePrepStmts=true"  # 已注释：旧地址
    # url = "jdbc:mysql://127.0.0.1:3306/gmall?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&rewriteBatchedStatements=true&useServerPrepStmts=true&cachePrepStmts=true"  # 已注释：容器内127不可用
    url = "jdbc:mysql://host.docker.internal:3306/gmall?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&rewriteBatchedStatements=true&useServerPrepStmts=true&cachePrepStmts=true"
    driver = "com.mysql.cj.jdbc.Driver"
    connection_check_timeout_sec = 30
    # user = "root"  # 已注释：旧账号配置
    user = "root"
    # password = ""  # 已注释：旧账号配置
    password = "123456"

    # 使用分区并行读取
    query = "select id, order_id, order_detail_id, coupon_id, coupon_use_id, sku_id, create_time from gmall.order_detail_coupon"
    partition_column = "id"
    partition_num = 4

    # 连接池配置
    # connection_pool {  # 已注释：3.1.1不支持
      # max_size = 10  # 已注释：3.1.1不支持-块内
      # min_idle = 3  # 已注释：3.1.1不支持-块内
      # max_idle_ms = 60000  # 已注释：3.1.1不支持-块内
    # }  # 已注释：3.1.1不支持-块结束

    # 批处理配置
    fetch_size = 5000
    # batch_size = 2000  # 已注释：3.1.1不支持
    # is_exactly_once = true  # 已注释：3.1.1不支持
  }
}

transform {
  Sql {
    source_table_name = "mysql_seatunnel"
    result_table_name = "iceberg_sink_data"

    query = """
      select 
        id, 
        formatdatetime(create_time,'yyyy-MM-dd') as k1,
        order_id, 
        order_detail_id, 
        coupon_id, 
        coupon_use_id, 
        sku_id, 
        create_time
      from mysql_seatunnel
    """
  }
}

sink {
  Iceberg {
    source_table_name = "iceberg_sink_data"

    # Iceberg Catalog：JDBC 元数据 + MinIO S3 存储
    catalog_name = "iceberg_catalog"
    iceberg.catalog.config = {
      type = "jdbc"
      uri = "jdbc:postgresql://host.docker.internal:5432/iceberg_meta"
      jdbc.user = "root"
      jdbc.password = "123456"
      warehouse = "s3://lakehouse/iceberg_lake_doris/"
      io-impl = "org.apache.iceberg.aws.s3.S3FileIO"
      s3.endpoint = "http://minio:9000"
      s3.access-key-id = "ak6c52d75066d96ddd"
      s3.secret-access-key = "5cf0fa1d0e1fd9bf182be642beca1a15"
      s3.region = "us-east-1"
      s3.path-style-access = "true"
    }

    namespace = "iceberg_doris_ods"
    table = "ods_order_detail_coupon_full"

    # 写入格式
    iceberg.table.write-props = {
      write.format.default = "parquet"
      write.target-file-size-bytes = 536870912
    }

    # 主键与分区（upsert 需显式主键，format version 用 2）
    iceberg.table.primary-keys = "id"
    iceberg.table.partition-keys = "k1"
    iceberg.table.upsert-mode-enabled = true
    iceberg.table.schema-evolution-enabled = true
    iceberg.table.auto-create-props = {
      "format-version" = "2"
    }
    case_sensitive = true
  }
}
